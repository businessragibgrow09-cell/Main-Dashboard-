<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnsio Style - TrackFlow Dashboard</title>
    
    <!-- FAVICON LOGO -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%2338bdf8' d='M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z'/></svg>">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex overflow-hidden">

    <!-- SIDEBAR NAVIGATION -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 p-5 flex flex-col justify-between hidden md:flex">
        <div class="space-y-6">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-purple-600 rounded-xl flex items-center justify-center font-bold text-white shadow-lg shadow-purple-600/30">
                    <i class="fa-solid fa-chart-line"></i>
                </div>
                <span class="font-black text-lg text-white">EARN<span class="text-purple-500">SIO</span></span>
            </div>

            <nav class="space-y-1 text-sm font-semibold">
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 bg-purple-600/10 text-purple-400 rounded-xl border border-purple-500/20">
                    <i class="fa-solid fa-chart-pie"></i> Overview
                </a>
                <a href="#offers-section" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white rounded-xl transition">
                    <i class="fa-solid fa-link"></i> Campaign Offers
                </a>
                <a href="#analytics-section" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white rounded-xl transition">
                    <i class="fa-solid fa-wallet"></i> Earnings & Stats
                </a>
            </nav>
        </div>

        <button id="btn-logout-side" class="flex items-center gap-2 text-xs font-bold text-red-400 hover:text-red-300 transition">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
    </aside>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto">
        <!-- TOP HEADER -->
        <header class="h-16 border-b border-slate-800 px-6 flex items-center justify-between bg-slate-900/50 sticky top-0 z-10 backdrop-blur-md">
            <div class="flex items-center gap-2">
                <span class="text-xs bg-purple-500/10 text-purple-400 border border-purple-500/20 px-3 py-1 rounded-full font-bold uppercase">Publisher Panel</span>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-xs font-bold text-white bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl">🟢 Ragib Bhai</span>
            </div>
        </header>

        <!-- DASHBOARD BODY -->
        <div class="p-6 space-y-6 flex-1">
            
            <!-- STATS OVERVIEW -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl">
                    <p class="text-xs text-slate-400 font-bold uppercase">Total Clicks</p>
                    <h3 class="text-3xl font-black text-purple-400 mt-1">150</h3>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl">
                    <p class="text-xs text-slate-400 font-bold uppercase">Target Status</p>
                    <h3 class="text-3xl font-black text-cyan-400 mt-1">15 / 15</h3>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl">
                    <p class="text-xs text-slate-400 font-bold uppercase">Total Earnings</p>
                    <h3 class="text-3xl font-black text-emerald-400 mt-1">₹75.00</h3>
                </div>
            </div>

            <!-- OFFER LINKS & ALIAS GENERATOR SECTION -->
            <div id="offers-section" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-xl">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-link text-purple-400"></i> Smart Offer Links & Alias Generator
                </h3>

                <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col md:flex-row items-center justify-between gap-3">
                    <!-- Link Display with Toggle -->
                    <div class="w-full md:w-1/2 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 flex items-center gap-2">
                        <button type="button" id="toggle-eye-1" class="text-slate-400 hover:text-white text-sm">
                            <i class="fa-solid fa-eye-slash" id="eye-icon-1"></i>
                        </button>
                        <input type="password" id="offer-link-1" readonly value="https://earnsio.in/ref=ragib_gamer" class="bg-transparent text-xs text-slate-300 w-full outline-none font-mono">
                    </div>

                    <!-- Alias Customizer Input -->
                    <div class="w-full md:w-1/3 bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 flex items-center gap-1">
                        <span class="text-slate-500 text-xs">@</span>
                        <input type="text" id="alias-input-1" placeholder="custom-alias" class="bg-transparent text-xs text-purple-300 w-full outline-none">
                        <button type="button" id="save-alias-1" class="bg-purple-600 hover:bg-purple-500 text-white text-[11px] font-bold px-2.5 py-1 rounded-lg transition">
                            Save
                        </button>
                    </div>

                    <!-- Copy Button -->
                    <button id="copy-btn-1" class="w-full md:w-auto bg-slate-800 hover:bg-slate-700 text-cyan-400 text-xs font-bold px-4 py-2 rounded-xl transition shadow-md">
                        Copy Link
                    </button>
                </div>
            </div>

            <!-- EARNINGS / ANALYTICS SECTION -->
            <div id="analytics-section" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3 shadow-xl">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-wallet text-purple-400"></i> Performance & Traffic Log
                </h3>
                <p class="text-xs text-slate-400">Real-time tracking of clicks, conversions, and smart link redirects active.</p>
            </div>

        </div>
    </main>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Password/Link visibility toggle
        const offerLink1 = document.getElementById('offer-link-1');
        const eyeIcon1 = document.getElementById('eye-icon-1');
        document.getElementById('toggle-eye-1').addEventListener('click', () => {
            if (offerLink1.type === "password") {
                offerLink1.type = "text";
                eyeIcon1.classList.remove('fa-eye-slash');
                eyeIcon1.classList.add('fa-eye');
            } else {
                offerLink1.type = "password";
                eyeIcon1.classList.remove('fa-eye');
                eyeIcon1.classList.add('fa-eye-slash');
            }
        });

        // Save Alias functionality
        document.getElementById('save-alias-1').addEventListener('click', () => {
            const alias = document.getElementById('alias-input-1').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
            if (!alias) {
                alert('कृपया सही एलाइज़ (Alias) दर्ज करें!');
                return;
            }
            offerLink1.value = `https://earnsio.in/ref=ragib&alias=${alias}`;
            alert('एलाइज़ सफलतापूर्वक सेव हो गया है!');
        });

        // Copy Link functionality
        document.getElementById('copy-btn-1').addEventListener('click', () => {
            navigator.clipboard.writeText(offerLink1.value);
            alert('लिंक कॉपी हो गया है!');
        });
    </script>
</body>
</html>
