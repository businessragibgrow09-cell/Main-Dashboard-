<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offer Management Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { margin-bottom: 15px; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 8px; }
        .section { margin-bottom: 30px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-danger { background-color: #e74c3c; color: white; }
        .btn-warning { background-color: #f39c12; color: white; }
        .btn-success { background-color: #2ecc71; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f8f9fa; }
        .status-active { color: #2ecc71; font-weight: bold; }
        .status-suspended { color: #e74c3c; font-weight: bold; }
        .action-btns { display: flex; gap: 5px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Add Offer Section -->
    <div class="section">
        <h2>Add Offer</h2>
        <form id="addOfferForm">
            <div class="form-group">
                <label for="offerTitle">Title</label>
                <input type="text" id="offerTitle" placeholder="Enter Offer Title" required>
            </div>
            <div class="form-group">
                <label for="trackingLink">Tracking Link</label>
                <input type="text" id="trackingLink" placeholder="https://example.com/track?aff=..." required>
            </div>
            <div class="form-group">
                <label for="offerType">Type</label>
                <select id="offerType">
                    <option value="Install" selected>Install</option>
                </select>
            </div>
            <div class="form-group">
                <label for="payout">Payout</label>
                <input type="number" id="payout" placeholder="e.g. 10" required>
            </div>
            <button type="submit" class="btn btn-primary">Publish Offer</button>
        </form>
    </div>

    <!-- Campaign / Offers List -->
    <div class="section">
        <h2>Campaign / Offers List</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Type</th>
                    <th>Payout</th>
                    <th>Tracking Link</th>
                    <th>Clicks</th>
                    <th>Conversions</th>
                </tr>
            </thead>
            <tbody id="offersTableBody">
                <!-- Dynamic Content -->
            </tbody>
        </table>
    </div>

    <!-- Network Users Section -->
    <div class="section">
        <h2>Network Users</h2>
        <table>
            <thead>
                <tr>
                    <th>User ID</th>
                    <th>Name</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="usersTableBody">
                <!-- Dynamic Content -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // State management
    let offers = [];
    let users = [
        { id: 'USR-101', name: 'User One', status: 'Active' },
        { id: 'USR-102', name: 'User Two', status: 'Suspended' }
    ];

    // Handle Offer Submission
    document.getElementById('addOfferForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const title = document.getElementById('offerTitle').value;
        const link = document.getElementById('trackingLink').value;
        const type = document.getElementById('offerType').value;
        const payout = document.getElementById('payout').value;

        const newOffer = {
            id: 'OFF-' + Math.floor(1000 + Math.random() * 9000),
            title: title,
            link: link,
            type: type,
            payout: payout,
            clicks: 0,
            conversions: 0
        };

        offers.push(newOffer);
        renderOffers();
        this.reset();
    });

    // Render Offers
    function renderOffers() {
        const tbody = document.getElementById('offersTableBody');
        tbody.innerHTML = '';

        if(offers.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No offers available.</td></tr>';
            return;
        }

        offers.forEach(offer => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${offer.id}</td>
                <td>${offer.title}</td>
                <td>${offer.type}</td>
                <td>$${offer.payout}</td>
                <td><a href="${offer.link}" target="_blank" onclick="trackClick('${offer.id}')">Link</a></td>
                <td>${offer.clicks}</td>
                <td>${offer.conversions}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Track Click & Conversion Logic
    function trackClick(offerId) {
        const offer = offers.find(o => o.id === offerId);
        if(offer) {
            offer.clicks += 1;
            // Simulated Goal Conversion
            if(Math.random() > 0.3) { 
                offer.conversions += 1;
            }
            renderOffers();
        }
    }

    // Render Users
    function renderUsers() {
        const tbody = document.getElementById('usersTableBody');
        tbody.innerHTML = '';

        users.forEach(user => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${user.id}</td>
                <td>${user.name}</td>
                <td class="${user.status === 'Active' ? 'status-active' : 'status-suspended'}">${user.status}</td>
                <td class="action-btns">
                    ${user.status === 'Active' 
                        ? `<button class="btn btn-warning" onclick="toggleUserStatus('${user.id}', 'Suspended')">Suspend</button>` 
                        : `<button class="btn btn-success" onclick="toggleUserStatus('${user.id}', 'Active')">Activate</button>`
                    }
                    <button class="btn btn-danger" onclick="deleteUser('${user.id}')">Delete Permanent</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Toggle Active / Suspend
    function toggleUserStatus(userId, newStatus) {
        const user = users.find(u => u.id === userId);
        if(user) {
            user.status = newStatus;
            renderUsers();
        }
    }

    // Permanent Delete User
    function deleteUser(userId) {
        if(confirm('Are you sure you want to permanently delete this user?')) {
            users = users.filter(u => u.id !== userId);
            renderUsers();
        }
    }

    // Initial Render
    renderOffers();
    renderUsers();
</script>

</body>
</html>
