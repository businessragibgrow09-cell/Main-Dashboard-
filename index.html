<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackFlow Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .tf-glow { box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">

  <!-- LOGIN SECTION -->
  <div id="auth-section" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full shadow-2xl">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-black text-white">TRACK<span class="text-purple-500">FLOW</span></h2>
        <p class="text-xs text-slate-400 mt-1">Sign in to your account</p>
      </div>

      <form id="login-form" method="POST" action="javascript:void(0);" class="space-y-4">
        <div>
          <label class="text-xs text-slate-400 block mb-1 font-semibold">Email or Phone Number</label>
          <input type="text" name="username" id="auth-email" required autocomplete="username" placeholder="Email or Phone Number" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
        </div>

        <div>
          <label class="text-xs text-slate-400 block mb-1 font-semibold">Password</label>
          <div class="relative">
            <input type="password" name="password" id="auth-password" required autocomplete="current-password" placeholder="Password" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-4 pr-10 py-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
            <!-- EYE ICON FOR LOGIN PASSWORD -->
            <button type="button" id="toggle-login-pass" class="absolute right-3 top-2.5 text-slate-400 hover:text-white">
              <i class="fa-solid fa-eye-slash" id="login-eye-icon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-purple-600/30">
          Login
        </button>
      </form>
      <p id="auth-error" class="text-xs text-red-400 mt-3 text-center hidden"></p>
    </div>
  </div>

  <!-- MAIN DASHBOARD WITH SIDE NAVIGATION BAR -->
  <div id="dashboard-section" class="hidden flex min-h-screen">
    
    <!-- SIDEBAR NAVIGATION -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 p-5 flex flex-col justify-between hidden md:flex">
      <div class="space-y-6">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 bg-purple-600 rounded-xl flex items-center justify-center font-bold text-white">TF</div>
          <span class="font-black text-lg text-white">TRACK<span class="text-purple-500">FLOW</span></span>
        </div>

        <nav class="space-y-1 text-sm font-semibold">
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 bg-purple-600/10 text-purple-400 rounded-xl border border-purple-500/20">
            <i class="fa-solid fa-chart-pie"></i> Overview
          </a>
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white rounded-xl">
            <i class="fa-solid fa-link"></i> Offer Links
          </a>
          <!-- ADMIN / PUBLISHER EXCLUSIVE MENU -->
          <div id="admin-menu-items" class="hidden space-y-1 pt-2 border-t border-slate-800">
            <a href="#admin-user-management" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white rounded-xl">
              <i class="fa-solid fa-user-plus"></i> Add User
            </a>
            <a href="#managed-users" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white rounded-xl">
              <i class="fa-solid fa-users"></i> All Users
            </a>
          </div>
        </nav>
      </div>

      <button id="btn-logout-side" class="flex items-center gap-2 text-xs font-bold text-red-400 hover:text-red-300">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 flex flex-col">
      <!-- TOP BAR -->
      <header class="h-16 border-b border-slate-800 px-6 flex items-center justify-between bg-slate-900/50">
        <div class="flex items-center gap-2">
          <span id="role-badge" class="text-xs bg-purple-500/10 text-purple-400 border border-purple-500/20 px-3 py-1 rounded-full font-bold uppercase">Role</span>
        </div>
        <div class="flex items-center gap-3">
          <span id="user-name-display" class="text-xs font-bold text-white">User</span>
          <button id="btn-logout" class="md:hidden text-xs text-red-400 font-bold">Logout</button>
        </div>
      </header>

      <!-- DASHBOARD BODY -->
      <div class="p-6 space-y-6 flex-1 overflow-y-auto">
        
        <!-- STATS (ALL SET TO ZERO) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
            <p class="text-xs text-slate-400 font-bold uppercase">Total Clicks</p>
            <h3 id="total-clicks" class="text-3xl font-black text-purple-400 mt-1">0</h3>
          </div>
          <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
            <p class="text-xs text-slate-400 font-bold uppercase">Target Clicks</p>
            <h3 id="clicks-target" class="text-3xl font-black text-cyan-400 mt-1">0</h3>
          </div>
          <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
            <p class="text-xs text-slate-400 font-bold uppercase">Total Revenue</p>
            <h3 id="est-revenue" class="text-3xl font-black text-emerald-400 mt-1">₹0.00</h3>
          </div>
        </div>

        <!-- ADD USER SECTION (ADMIN / PUBLISHER ONLY) -->
        <div id="admin-user-management" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
          <h3 class="text-sm font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-user-plus text-purple-400"></i> Add New User
          </h3>
          <form id="add-user-form" class="grid grid-cols-1 md:grid-cols-4 gap-3">
            <input type="text" id="new-user-name" required placeholder="User Name" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
            <input type="text" id="new-user-email" required placeholder="Email or Phone Number" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
            <input type="text" id="new-user-pass" required placeholder="Password" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
            <select id="new-user-role" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-purple-300 font-bold">
              <option value="creator">Creator</option>
              <option value="publisher">Publisher</option>
            </select>
            <button type="submit" class="md:col-span-4 bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 rounded-xl text-xs transition">Create Account</button>
          </form>

          <!-- MANAGED USERS LIST WITH EYE ICON FOR PASSWORDS -->
          <div id="managed-users" class="mt-4 pt-4 border-t border-slate-800">
            <h4 class="text-xs font-bold text-slate-400 uppercase mb-3">Created Users</h4>
            <div id="users-list-container" class="space-y-2"></div>
          </div>
        </div>

        <!-- OFFER LINKS SECTION -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
          <h3 class="text-sm font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-link text-purple-400"></i> Active Campaign Links
          </h3>
          <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col md:flex-row items-center justify-between gap-3">
            <span class="text-xs text-purple-300 font-mono">https://ff-rewards-hub-gamma.vercel.app/</span>
            <button id="copy-btn-1" class="bg-slate-800 hover:bg-slate-700 text-cyan-400 text-xs font-bold px-4 py-2 rounded-xl transition">
              Copy Link
            </button>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDhi-7RfGoAV1K9gXBiQcd3vUtHCmPrTCQ",
      authDomain: "trackflow-92b4e.firebaseapp.com",
      projectId: "trackflow-92b4e",
      storageBucket: "trackflow-92b4e.firebasestorage.app",
      messagingSenderId: "524980292297",
      appId: "1:524980292297:web:584e81fa8197e17e881b18"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // LOGIN EYE ICON TOGGLE
    const loginPassInput = document.getElementById('auth-password');
    const loginEyeIcon = document.getElementById('login-eye-icon');
    document.getElementById('toggle-login-pass').addEventListener('click', () => {
      if (loginPassInput.type === "password") {
        loginPassInput.type = "text";
        loginEyeIcon.classList.remove('fa-eye-slash');
        loginEyeIcon.classList.add('fa-eye');
      } else {
        loginPassInput.type = "password";
        loginEyeIcon.classList.remove('fa-eye');
        loginEyeIcon.classList.add('fa-eye-slash');
      }
    });

    // LOGIN FORM
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      let inputVal = document.getElementById('auth-email').value.trim().toLowerCase();
      const pass = document.getElementById('auth-password').value.trim();
      const authError = document.getElementById('auth-error');

      if (!inputVal.includes('@')) {
        inputVal = `${inputVal}@trackflow.com`;
      }

      try {
        await signInWithEmailAndPassword(auth, inputVal, pass);
      } catch (err) {
        authError.innerText = "Incorrect Email/Phone or Password!";
        authError.classList.remove('hidden');
      }
    });

    // LOGOUT
    document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));
    document.getElementById('btn-logout-side').addEventListener('click', () => signOut(auth));

    // AUTH STATE
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');

        const snap = await getDoc(doc(db, "users", user.uid));
        let userData = snap.exists() ? snap.data() : { role: 'admin', name: user.email.split('@')[0], clicks: 0 };

        document.getElementById('user-name-display').innerText = userData.name || user.email;
        document.getElementById('role-badge').innerText = userData.role;

        // SHOW ROLE SPECIFIC PANELS
        if (userData.role === 'admin' || userData.role === 'publisher') {
          document.getElementById('admin-menu-items').classList.remove('hidden');
          document.getElementById('admin-user-management').classList.remove('hidden');
          loadCreatedUsers(userData, user.email);
        } else {
          document.getElementById('admin-menu-items').classList.add('hidden');
          document.getElementById('admin-user-management').classList.add('hidden');
        }
      } else {
        document.getElementById('auth-section').classList.remove('hidden');
        document.getElementById('dashboard-section').classList.add('hidden');
      }
    });

    // ADD USER
    document.getElementById('add-user-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('new-user-name').value;
      let email = document.getElementById('new-user-email').value.toLowerCase().trim();
      const pass = document.getElementById('new-user-pass').value;
      const role = document.getElementById('new-user-role').value;

      if (!email.includes('@')) email = `${email}@trackflow.com`;

      const newUserId = "user_" + Date.now();
      await setDoc(doc(db, "users", newUserId), {
        name, email, password: pass, role, createdBy: auth.currentUser.email, clicks: 0
      });

      alert('User Created Successfully!');
      document.getElementById('add-user-form').reset();
      loadCreatedUsers({ role: 'admin' }, auth.currentUser.email);
    });

    // LOAD USERS WITH EYE ICON FOR PASSWORDS
    async function loadCreatedUsers(currentUser, currentEmail) {
      const container = document.getElementById('users-list-container');
      container.innerHTML = "Loading...";

      const q = currentUser.role === 'admin' ? collection(db, "users") : query(collection(db, "users"), where("createdBy", "==", currentEmail));
      const snap = await getDocs(q);
      container.innerHTML = "";

      snap.forEach((docSnap) => {
        const u = docSnap.data();
        const div = document.createElement('div');
        div.className = "bg-slate-950 border border-slate-800 p-3 rounded-xl flex justify-between items-center text-xs";
        div.innerHTML = `
          <div>
            <span class="font-bold text-white">${u.name}</span>
            <span class="text-[10px] bg-purple-900 text-purple-300 px-2 py-0.5 rounded ml-2">${u.role}</span>
          </div>
          <div class="flex items-center gap-3 font-mono">
            <span class="text-slate-400">${u.email}</span>
            <span id="pass-${docSnap.id}">••••••••</span>
            <button onclick="togglePass('${docSnap.id}', '${u.password}')" class="text-purple-400">
              <i class="fa-solid fa-eye-slash" id="icon-${docSnap.id}"></i>
            </button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    window.togglePass = function(id, rawPass) {
      const p = document.getElementById(`pass-${id}`);
      const ic = document.getElementById(`icon-${id}`);
      if (p.innerText === "••••••••") {
        p.innerText = rawPass;
        ic.classList.replace('fa-eye-slash', 'fa-eye');
      } else {
        p.innerText = "••••••••";
        ic.classList.replace('fa-eye', 'fa-eye-slash');
      }

    };

    document.getElementById('copy-btn-1').addEventListener('click', () => {
      navigator.clipboard.writeText('https://ff-rewards-hub-gamma.vercel.app/');
      alert('Link Copied!');
    });
  </script>
</body>
</html>
