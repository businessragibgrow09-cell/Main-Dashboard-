<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Founder Control Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #fff; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { margin-bottom: 20px; color: #38bdf8; text-align: center; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
    h3 { margin-bottom: 12px; color: #f87171; }
    input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; }
    button { width: 100%; padding: 12px; background: #22c55e; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
    button:hover { background: #16a34a; }
    .link-box { background: #0f172a; padding: 12px; border-radius: 6px; margin-top: 10px; word-break: break-all; font-size: 14px; border: 1px dashed #38bdf8; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
    th { background: #334155; color: #38bdf8; }
  </style>
</head>
<body>

<div class="container">
  <h1>⚡ Founder Admin Dashboard</h1>

  <div class="card">
    <h3>1. नया पार्टनर / क्रिएटर जोड़ें</h3>
    <input type="text" id="partnerId" placeholder="पार्टनर का नाम या Alias (उदा: arhan_gaming)">
    <button onclick="generatePartner()">Link Generate करें</button>
    <div id="output" style="display:none;" class="link-box"></div>
  </div>

  <div class="card">
    <h3>2. सभी पार्टनर्स का लाइव डेटा (Real-Time)</h3>
    <table>
      <thead>
        <tr>
          <th>Partner Name</th>
          <th>Total Clicks</th>
          <th>Est. Payout (₹150/1K)</th>
        </tr>
      </thead>
      <tbody id="partnerTable">
        <tr><td colspan="3">Loading data...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCs5X9luNPAYqEjVsk5PYh1cZrp-y4vcgw",
    authDomain: "ff-dashboard-e96dd.firebaseapp.com",
    projectId: "ff-dashboard-e96dd",
    storageBucket: "ff-dashboard-e96dd.firebasestorage.app",
    messagingSenderId: "710937510821",
    appId: "1:710937510821:web:24542defaad7f8349cde4c",
    measurementId: "G-JESJEE3J8X"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.generatePartner = async function() {
    const id = document.getElementById('partnerId').value.trim().toLowerCase().replace(/\s+/g, '_');
    if(!id) return alert("कृपया पार्टनर का नाम डालें!");

    await setDoc(doc(db, "partners", id), { name: id, clicks: 0 }, { merge: true });

    const baseUrl = window.location.origin;
    const out = document.getElementById('output');
    out.style.display = "block";
    out.innerHTML = `
      <p style="margin-bottom:8px;"><b>प्रोमो लिंक (पार्टनर को दें):</b><br><span style="color:#22c55e;">${baseUrl}/?ref=${id}</span></p>
      <p><b>पार्टनर का डैशबोर्ड लिंक:</b><br><span style="color:#38bdf8;">${baseUrl}/partner.html?id=${id}</span></p>
    `;
  };

  // Live Database Sync
  onSnapshot(collection(db, "partners"), (snapshot) => {
    const tbody = document.getElementById('partnerTable');
    tbody.innerHTML = '';
    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const clicks = data.clicks || 0;
      const payout = (clicks / 1000) * 150; // ₹150 प्रति 1,000 क्लिक्स

      tbody.innerHTML += `
        <tr>
          <td style="font-weight:bold; color:#f87171;">${docSnap.id}</td>
          <td>${clicks}</td>
          <td style="color:#22c55e; font-weight:bold;">₹${payout.toFixed(2)}</td>
        </tr>
      `;
    });
  });
</script>

</body>
</html>
